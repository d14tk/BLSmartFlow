# Build-it-yourself configuration.
#   1. cp secrets.yaml.example secrets.yaml and fill in your values
#   2. esphome run blflow.yaml
# Printer IP, access code and serial are entered later in the device's web UI.

packages:
  blsmartflow: !include common.yaml

esp32:
  # Same layout as the original Arduino firmware (2 x 1280 KB app slots), so the image can be
  # uploaded through the old web updater (/update) and the size check matches real devices.
  partitions: partitions.csv

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: BLSmartFlow Setup
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key
  # A missing Home Assistant connection must never reboot a fan controller
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
