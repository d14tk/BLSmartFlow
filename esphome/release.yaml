# Builds the release binaries: blflow-prebuilt.yaml plus the legacy partition layout.
#   esphome compile release.yaml
# Output: .esphome/build/blsmartflow/build/firmware.factory.bin (USB / ESPHome Web)
#         .esphome/build/blsmartflow/build/firmware.ota.bin     (old /update page, ESPHome OTA)

packages:
  prebuilt: !include blflow-prebuilt.yaml

esp32:
  partitions: partitions.csv
